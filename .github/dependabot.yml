version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
